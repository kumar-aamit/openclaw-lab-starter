<p class="demo-answer">{{ text }}</p>
<p class="demo-route" hx-trigger="load" hx-get="/status/tiles" hx-target=".tiles" hx-swap="innerHTML">
  {% if mocked %}
  {{ icon("circle-minus") }} Mock answer: no model was called.
  {% else %}
  <span>Browser → App → {{ endpoint.short_name }}, all in {{ site }}</span>
  <span class="mono">{{ (ms / 1000) | round(1) }} s · {{ tokens }} tokens</span>
  <strong class="free">$0</strong>
  {% endif %}
</p>
