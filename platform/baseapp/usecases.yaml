# Use cases on the start page. Alert Triage's prompts must match catalog/it-alert-triage.md word for
# word (tests/test_walkthrough.py). done_when: what the app must have for a step to count as sent:
# "screen", "knowledge", or an answer block kind.

- id: triage
  name: Alert Triage
  industry: IT
  screen: Triage an alert
  inputs: [Paste the alert, Attach the logs, Affected system]
  sample:
    score: 88 · Act now
    text: 212 failed VPN logins for 9 users from 203.0.113.45, then a success for j.ortiz at 02:14:07.
    table:
      - [T1110.003, Password spraying]
      - [T1078, Valid accounts]
    checklist:
      - Disable j.ortiz and reset the password · Password spray › Contain
      - Block 203.0.113.45 at vpn-gw-01 · Password spray › Contain
  steps:
    - name: Build
      adds: [text]
      done_when: [screen]
      see: Click **Password spray, then a login**. You get a verdict.
      prompt: >-
        Build an alert triage app for our HQ security team. An analyst pastes an alert, can attach its
        logs and pick the affected system, and gets a verdict on what happened. Make up sample alerts
        and logs to try it with. Use the Alert Triage brief.
    - name: Ground it
      adds: [checklist]
      done_when: [knowledge, checklist]
      see: Click the same example. **Next steps** appear, each citing a runbook section.
      prompt: >-
        Add our incident runbooks for password spray, phishing and malware, and give the analyst next
        steps from them, each showing the runbook section it came from.
    - name: Shape the answer
      adds: [score, table]
      done_when: [score, table]
      see: Try all three examples. Password spray scores **80 or more**, the locked-out user **under 40**.
      prompt: >-
        Add a severity score from 0 to 100 and a table of the MITRE ATT&CK techniques. Count the failed
        logins in the logs exactly instead of letting the AI guess. Add a harmless example too: a user
        who got locked out and was already reset.

- id: config
  name: Config Auditor
  industry: IT
  screen: Audit a device config
  inputs: [Paste the running config, Baseline]
  blocks: [score, table, checklist]
  prompt: >-
    Build an app for our NOC network engineers. They paste a router or switch running config and pick
    the baseline. They get back a baseline compliance score from 0 to 100, a table of the rules that
    fail with the exact config line and the fix, and a checklist of changes in a safe order, each
    citing the hardening baseline section. Make up a 12-rule hardening baseline and two example
    configs: an edge router with Telnet on and a hardened core switch.

- id: line
  name: Line Assist
  industry: Manufacturing
  screen: Diagnose a machine
  inputs: [Machine, "What is it doing?", Alarm log]
  blocks: [table, checklist, text]
  prompt: >-
    Build an app for maintenance technicians at Plant 3. They pick the machine, describe what it is
    doing, and can attach its alarm log. They get back a table of likely causes ranked by likelihood
    with what to check, a checklist of steps in order starting with lockout, and the parts to bring,
    each citing the press manual section. Make up a press manual and an example: a hydraulic press
    running slow with an oil overtemperature alarm.

- id: shrink
  name: Shrink Analyst
  industry: Retail
  screen: Review POS exceptions
  inputs: [Exceptions export, Store]
  blocks: [score, table, checklist]
  prompt: >-
    Build an app for store loss prevention leads. They attach the week's point-of-sale exceptions
    export and pick the store. They get back a review priority score from 0 to 100, a table of
    patterns worth a review with the cashier and the evidence, and next steps for the loss prevention
    lead. Count voids, refunds and no-sales exactly instead of letting the AI guess. Make up an
    exceptions export for one store where one cashier stands out.

- id: discharge
  name: Discharge in Plain Words
  industry: Healthcare
  screen: Rewrite discharge instructions
  inputs: [Discharge summary, Reading level, Language]
  blocks: [text, checklist]
  prompt: >-
    Build an app for ward nurses at St. Brigid's Hospital. They paste a discharge summary and pick a
    reading level and language. They get back plain instructions for going home, a checklist of the
    patient's medicines with what each one does, and when to call 911 or come back, citing the
    patient leaflet section. Make up a synthetic heart failure discharge summary to try it with.
    Never use real patient data.

- id: aml
  name: AML Narrator
  industry: Financial services
  screen: Narrate a monitoring alert
  inputs: [Monitoring alert, Customer profile, Account transactions]
  blocks: [score, table, text]
  prompt: >-
    Build an app for bank AML investigators. They paste the transaction-monitoring alert and the
    customer profile, and can attach the account's transactions. They get back an escalation risk
    score from 0 to 100, a table of red flags with the evidence, and a draft disposition narrative
    for the case file, citing our typology guide. Add up the deposits and wires exactly instead of
    letting the AI guess. Make up a structuring example with offshore wires.

- id: release
  name: Release Review
  industry: Public sector
  screen: Review a record before release
  inputs: [Document text, Release under]
  blocks: [table, text]
  prompt: >-
    Build an app for county records officers. They paste a document and pick the law it is released
    under. They get back a table of suggested redactions with the exemption and the reason, and a
    release summary explaining what stays public, citing our records exemption guide. Make up a code
    enforcement email with a phone number, a health detail and attorney advice to try it with.

- id: alarm
  name: Alarm Flood
  industry: Energy
  screen: Summarize an alarm flood
  inputs: [Alarm export, Substation]
  blocks: [text, table, checklist]
  prompt: >-
    Build an app for grid control center operators. They attach the SCADA alarm export from an event
    and pick the substation. They get back the likely initiating event in plain words, a table of
    alarm groups with what each means, and a checklist of next checks, citing the substation
    operating procedure. Group and count the alarms exactly instead of letting the AI guess. Make up
    a transformer trip alarm flood to try it with.

- id: clause
  name: Clause Review
  industry: Legal
  screen: Review a contract against the playbook
  inputs: [Contract, Playbook]
  blocks: [score, table, checklist]
  prompt: >-
    Build an app for the firm's contract lawyers. They attach a contract and pick the playbook. They
    get back a deviation score from 0 to 100, a table of key clauses with what the contract says, the
    playbook position and the deviation, and a checklist of what to ask for in the markup, citing the
    playbook section. Make up a vendor cloud services agreement and a playbook to try it with.

- id: own
  name: Your own idea
  own: true
  screen: Your screen
  inputs: [What they enter]
  blocks: [text]
  prompt: ""
